# GitHub Actions workflow
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/workflow-syntax-for-github-actions
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/contexts-and-expression-syntax-for-github-actions

name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dot_net_framework_test:
    name: .Net Framework 4.6.2
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSBuild Path
        uses: microsoft/setup-msbuild@c26a08ba26249b81327e26f6ef381897b6a8754d # v1.0.2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@296fd3ccf8528660c91106efefe2364482f86d6f # v1
        with:
          nuget-version: "5.x"

      - name: Restore NuGet Packages
        run: nuget restore shipengine-dotnet.sln

      - name: Build .Net App
        run: msbuild shipengine-dotnet.sln /p:Configuration=Release

      - name: Run Test
        run: dotnet test ShipEngineSDK.Test/bin/Release/net462/ShipEngineSDK.Test.dll

  dot_net_core_test:
    name: .Net 8.0 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup dotnet 8.0.x
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Dotnet tool restore
        run: dotnet tool restore

      - name: Lint
        if: ${{ matrix.os == 'ubuntu-latest'}}
        run: dotnet format

      - name: Dotnet Build
        run: dotnet build --configuration Release

      - name: Run 8.0 Tests
        run: dotnet test -f net8.0 --settings ShipEngineSDK.Test/coverage.runsettings

      - name: Move generated lcov file to expected location
        shell: bash
        run: |
          ls -Rlh ShipEngineSDK.Test/TestResults/*/coverage.info
          cat ShipEngineSDK.Test/TestResults/*/coverage.info > ShipEngineSDK.Test/TestResults/lcov.info

  nuget-deploy:
    runs-on: ubuntu-latest
    needs: [dot_net_framework_test, dot_net_core_test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    # `id-token: write` is only for nuget.org Trusted Publishing (OIDC). Nothing here pushes to git.
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup dotnet 8.0.x
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Read package version
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ShipEngineSDK/ShipEngineSDK.csproj | head -n 1 | tr -d '[:space:]')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected version: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Package version: $version"

      # Publish on version change: skip when this version is already on nuget.org.
      # On workflow_dispatch from a non-main ref, only prerelease versions are published.
      - name: Check if version is already published
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          lower="${VERSION,,}"
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://api.nuget.org/v3-flatcontainer/shipengine/${lower}/shipengine.${lower}.nupkg")
          if [[ "$status" == "200" ]]; then
            echo "ShipEngine $VERSION already on nuget.org, nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" || "$PRERELEASE" == "true" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Manual run on a non-main ref with a stable version: not publishing."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        if: steps.check.outputs.published == 'true'
        run: dotnet pack ShipEngineSDK/ShipEngineSDK.csproj --configuration Release --output ./artifacts

      # Right before the push on purpose: the short-lived key lasts 1 h and can only be
      # exchanged once. `user` is the nuget.org profile name (not the email) that owns the policy.
      - name: NuGet login (OIDC)
        if: steps.check.outputs.published == 'true'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: steps.check.outputs.published == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # Separate job so that only the tagging step gets `contents: write`, and it never runs
  # alongside the publishing credentials.
  tag-release:
    runs-on: ubuntu-latest
    needs: nuget-deploy
    if: needs.nuget-deploy.outputs.published == 'true'
    permissions:
      contents: write
    steps:
      - name: Create git tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.nuget-deploy.outputs.version }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
          fi
