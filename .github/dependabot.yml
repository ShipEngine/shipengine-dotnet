version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date with minimal noise.
  # Dependabot security alerts do not cover actions pinned by commit SHA, so version
  # updates are the only mechanism that refreshes them: one grouped PR per month.
  # Keep the "# vX.Y.Z" comment next to each SHA: Dependabot reads and updates it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # Wait 7 days after a release is published before proposing it.
    cooldown:
      default-days: 7
    groups:
      all-github-actions:
        patterns:
          - "*"
